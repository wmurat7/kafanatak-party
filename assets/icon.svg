<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#8A2387"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF2E93" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Arka Plan -->
  <rect width="512" height="512" rx="128" fill="#0B0E14"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" opacity="0.15"/>
  <rect x="24" y="24" width="464" height="464" rx="108" stroke="url(#bgGrad)" stroke-width="8" fill="none"/>

  <!-- Telefon Sembolü (Yatay Alın Modu) -->
  <g transform="translate(106, 156)" filter="url(#glow)">
    <rect x="0" y="0" width="300" height="180" rx="32" fill="#151C2A" stroke="#00F5D4" stroke-width="6"/>
    <!-- Ekran -->
    <rect x="20" y="20" width="260" height="140" rx="20" fill="url(#bgGrad)"/>
    <!-- Kamera Lensi (Kayıt) -->
    <circle cx="282" cy="90" r="5" fill="#FF3B30"/>
    <!-- Gülen Yüz / Oyun İkonu -->
    <text x="150" y="105" font-family="'Outfit', sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle">🎉</text>
  </g>
</svg>
